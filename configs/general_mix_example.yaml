# 通用侧配比文件 —— 跟训练一起存档，以后能复现当初的比例
#
# 用法：
#   export FV_MYSQL_PASSWORD='...'
#   python3 scripts/export_general_mix.py --config configs/general_mix_example.yaml --dry-run
#   python3 scripts/export_general_mix.py --config configs/general_mix_example.yaml
#
# 没装 pyyaml 就用同目录的 .json，字段完全一样。

total: 200000            # 权重组瓜分的总量。不写则按「不失真上限」自动推算
seed: 42                   # 固定种子，同一份配置每次抽出来的是同一批
shuffle: true              # 采样随机 + 输出打散；false 则按 id 顺序取
on_shortfall: scale        # scale 等比缩小保比例 | take 有多少拿多少 | repeat 重复补足 | error 报错

render: zh                 # 读哪一列：zh 译文 | en 英文原文 | auto 按 lang_assigned 走
#
# 这次跑的 chinese_ratio=1.0，所有行的 lang_assigned 都是 zh，所以
# filter.lang 筛不出东西来；而 store_conversations=true 又把英文原文留在了
# 库里。也就是说同一条样本中英都有，**中英之分是读哪一列，不是筛哪些行**。
# 想要中英混合就分两组、各给一个 render，见文件末尾的例子。
# 组级 render 覆盖这里的全局值。
output: ./out/general_mix_v1.jsonl
split_by_group: false      # true 则 output 当作目录，每个类别一个 jsonl

mysql:                     # 和任务配置同一套；密码走环境变量，别写死
  host: 127.0.0.1
  port: 3306
  user: fv
  password: "${FV_MYSQL_PASSWORD}"
  database: finevision
  pool_size: 4             # 导出是单线程读，4 足够
  on_connect_error: fail

# 九个类别的 weight 和 max_share_per_dataset 来自 configs/sampling_plan_5m.json，
# 不是现编的。weight 是类别占总量的比例（九个加起来正好 1.0）。
#
# max_share_per_dataset 是单个数据集在本类别配额里的上限，通用侧必须有：
# FineVision 同一类别内数据集能差两个数量级，densefusion_1m 一家 105 万，
# 不封顶的话它吃掉 caption 类一半，抽出来的「通用数据」其实是一个集的复读。
# 想改成各数据集等分就把它换成 balance_by: dataset —— 但小数据集会填不满份额。

groups:
  - name: caption_图文描述
    weight: 0.22
    max_share_per_dataset: 0.18
    filter:
      dataset:
        - "densefusion_1m"
        - "allava_laion"
        - "google_landmarks"
        - "lvis_instruct4v"
        - "localized_narratives"
        - "coco_colors"
