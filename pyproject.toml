[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finevision-to-sharegpt"
version = "0.1.0"
description = "Convert FineVision-style zip/parquet datasets to ShareGPT multimodal JSONL."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=10,<12",
  "pyarrow>=15,<22",
  "tqdm>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
mysql = ["PyMySQL>=1.1,<2"]

[project.scripts]
finevision-to-sharegpt = "finevision_to_sharegpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
